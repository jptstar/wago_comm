name: Validate

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall custom_components/wago_750_8212_pfc200
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, pathlib
          for path in pathlib.Path('.').rglob('*.json'):
              json.loads(path.read_text())
              print('OK', path)
          PY
