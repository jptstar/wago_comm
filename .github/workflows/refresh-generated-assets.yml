name: Refresh generated assets

on:
  push:
    paths:
      - "tools/update_generated_assets.py"
      - ".github/workflows/refresh-generated-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Refresh CSV profile and translations
        run: python tools/update_generated_assets.py

      - name: Build Home Assistant brand variants
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          brand = Path("custom_components/wago_750_8212_pfc200/brand")
          icon = Image.open(brand / "icon.png").convert("RGBA")
          if icon.size != (256, 256):
              icon = icon.resize((256, 256), Image.Resampling.LANCZOS)
              icon.save(brand / "icon.png", optimize=True)

          icon2x = icon.resize((512, 512), Image.Resampling.LANCZOS)
          icon2x.save(brand / "icon@2x.png", optimize=True)

          # Match the structure used by wiserlink_mpi: same square artwork for
          # integration icon and logo, with standard and HiDPI variants.
          icon.save(brand / "logo.png", optimize=True)
          icon2x.save(brand / "logo@2x.png", optimize=True)
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/wago_points.csv \
            custom_components/wago_750_8212_pfc200/strings.json \
            custom_components/wago_750_8212_pfc200/translations/fr.json \
            custom_components/wago_750_8212_pfc200/brand/icon.png \
            custom_components/wago_750_8212_pfc200/brand/icon@2x.png \
            custom_components/wago_750_8212_pfc200/brand/logo.png \
            custom_components/wago_750_8212_pfc200/brand/logo@2x.png
          if git diff --cached --quiet; then
            echo "Nothing to refresh"
            exit 0
          fi
          git commit -m "Refresh WAGO profile and branding assets"
          git push
